<svg class="arch" width="940" height="470" viewBox="0 0 940 470" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="MiBeeBell 一句话架构：摄取层三类入口进入单进程 Go 二进制，经规范化、有界事件总线（满丢最旧）、四道闸告警管道、i18n 模板渲染、分发器（重试/令牌桶/审计）送达多渠道；SQLite WAL 横切存储；REST/SSE/指标/Web UI 出口">
  <style>
    .arch{font-family:'Cascadia Code','JetBrains Mono',Consolas,Menlo,'Courier New',monospace;
      --bg:#0b0f16;--panel:#10161f;--edgest:#26313f;--fg:#e6edf3;--dim:#7d8b99;--frame:#1f2733;
      --cy:#22d3ee;--grn:#3fb950;--amb:#fbbf24}
    .win{fill:var(--bg);stroke:var(--frame);stroke-width:1}
    .t-title{font-size:12px;fill:var(--dim)}
    .t-badge{font-size:10.5px;fill:var(--grn);letter-spacing:.5px}
    .col-label{font-size:11px;fill:#5b8c6a}
    .chip .box{fill:var(--panel);stroke:var(--edgest);stroke-width:1}
    .chip .nm{font-size:11.5px;fill:var(--fg)}
    .note{font-size:11.5px;fill:var(--amb)}
    .note2{font-size:11px;fill:var(--dim)}
    .sep{stroke:var(--frame);stroke-width:1}
    .edge{fill:none;stroke:var(--cy);stroke-width:1.5;opacity:.8}
    .edge.out{stroke:var(--amb)}
    .edge.store{stroke:var(--grn);stroke-dasharray:4 4;stroke-width:1.2;opacity:.8}
    .hero .box{stroke:var(--amb);stroke-width:1.3}
    .hero .cap{font-size:10.5px;fill:var(--dim)}
    .pill .pbox{fill:#0f1e14;stroke:#238636;stroke-width:1}
    .pill .pt{font-size:10.5px;fill:var(--grn)}
    .pill.cy .pbox{stroke:#1b6d80}
    .pill.cy .pt{fill:var(--cy)}
    @keyframes chipIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
    .chip,.pill,.hero{animation:chipIn .4s cubic-bezier(.2,.7,.3,1) both;animation-delay:var(--d,0s)}
    @keyframes draw{to{stroke-dashoffset:0}}
    .draw{stroke-dasharray:1;stroke-dashoffset:1;animation:draw .5s ease-out forwards;animation-delay:var(--d,0s)}
    .pkt{fill:var(--amb)}.pkt.c{fill:var(--cy)}.pkt.g{fill:var(--grn)}
    @media (prefers-reduced-motion:reduce){.chip,.pill,.hero,.draw{animation:none}.draw{stroke-dashoffset:0}}
  </style>
  <defs>
    <pattern id="gp" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="13" cy="13" r="1" fill="#22d3ee" opacity=".05"/>
    </pattern>
    <marker id="mcy" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 z" fill="#22d3ee"/></marker>
    <marker id="mam" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 z" fill="#fbbf24"/></marker>
    <marker id="mgrn" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 z" fill="#3fb950"/></marker>
    <path id="pin" d="M262,163 C 300,163 292,182 326,182" fill="none"/>
    <path id="pstore" d="M470,296 L470,322" fill="none"/>
  </defs>

  <rect class="win" x="1" y="1" width="938" height="468" rx="12"/>
  <rect x="1" y="34" width="938" height="434" fill="url(#gp)"/>

  <circle cx="24" cy="18" r="5" fill="#ff5f56"/><circle cx="42" cy="18" r="5" fill="#ffbd2e"/><circle cx="60" cy="18" r="5" fill="#27c93f"/>
  <text class="t-title" x="470" y="22" text-anchor="middle">bee@bell:~/architecture — zsh</text>
  <rect x="806" y="9" width="116" height="18" rx="9" fill="#0f1e14" stroke="#238636" stroke-width="1"/>
  <text class="t-badge" x="864" y="21.5" text-anchor="middle">● SINGLE BINARY</text>
  <line class="sep" x1="1" y1="34" x2="939" y2="34"/>

  <text class="col-label" x="50" y="66">// 摄取层 · 七类入口</text>
  <text class="col-label" x="340" y="66">// 单进程 Go 二进制 · 内部管线</text>
  <text class="col-label" x="686" y="66">// 渠道插件 · 多渠道</text>

  <!-- edges: sources -> hero -->
  <path class="edge draw" style="--d:1.0s" pathLength="1" d="M262,110 C 300,110 292,170 326,172" marker-end="url(#mcy)"/>
  <path class="edge draw" style="--d:1.1s" pathLength="1" d="M262,158 C 300,158 292,182 326,182" marker-end="url(#mcy)"/>
  <path class="edge draw" style="--d:1.2s" pathLength="1" d="M262,206 C 300,206 292,194 326,192" marker-end="url(#mcy)"/>
  <!-- edges: hero -> channels -->
  <path class="edge out draw" style="--d:1.7s" pathLength="1" d="M614,130 C 650,130 644,110 676,110" marker-end="url(#mam)"/>
  <path class="edge out draw" style="--d:1.8s" pathLength="1" d="M614,158 C 650,158 644,154 676,154" marker-end="url(#mam)"/>
  <path class="edge out draw" style="--d:1.9s" pathLength="1" d="M614,182 C 650,182 644,198 676,198" marker-end="url(#mam)"/>
  <path class="edge out draw" style="--d:2.0s" pathLength="1" d="M614,206 C 650,206 644,242 676,242" marker-end="url(#mam)"/>
  <!-- store edges -->
  <path class="edge store draw" style="--d:2.1s" pathLength="1" d="M470,296 L470,320" marker-end="url(#mgrn)"/>
  <path class="edge store draw" style="--d:2.15s" pathLength="1" d="M470,352 L470,374" marker-end="url(#mgrn)"/>

  <!-- sources -->
  <g transform="translate(50,93)"><g class="chip" style="--d:.2s"><rect class="box" width="212" height="34" rx="7"/><text class="nm" x="14" y="22.5">MQTT</text></g></g>
  <g transform="translate(50,141)"><g class="chip" style="--d:.3s"><rect class="box" width="212" height="34" rx="7"/><text class="nm" x="14" y="22.5">通用 Webhook</text></g></g>
  <g transform="translate(50,189)"><g class="chip" style="--d:.4s"><rect class="box" width="212" height="34" rx="7"/><text class="nm" x="14" y="22.5">Alertmanager · PD · Grafana</text></g></g>
  <text class="note2" style="--d:.5s" x="50" y="248">简单 JSON（ntfy/Gotify 风格）</text>
  <text class="note2" style="--d:.55s" x="50" y="266">Bark 兼容路由</text>

  <!-- hero: internal pipeline -->
  <g transform="translate(330,88)"><g class="hero" style="--d:.6s">
    <rect class="box" width="284" height="212" rx="10" fill="#0d1420" stroke="#fbbf24"/>
    <text x="142" y="24" text-anchor="middle" font-size="13" font-weight="700" fill="#e6edf3">MiBeeBell 蜂铃 · 单进程</text>
  </g></g>
  <g transform="translate(352,100)"><g class="pill" style="--d:.8s"><rect class="pbox" width="240" height="24" rx="12"/><text class="pt" x="120" y="16.5" text-anchor="middle">规范化 normalize</text></g></g>
  <g transform="translate(352,134)"><g class="pill cy" style="--d:.9s"><rect class="pbox" width="240" height="24" rx="12"/><text class="pt" x="120" y="16.5" text-anchor="middle">事件总线 · 有界 1024 · 满丢最旧</text></g></g>
  <g transform="translate(352,168)"><g class="pill" style="--d:1.0s"><rect class="pbox" width="240" height="24" rx="12"/><text class="pt" x="120" y="16.5" text-anchor="middle">告警管道 · 四道闸 + L0 算法</text></g></g>
  <g transform="translate(352,202)"><g class="pill" style="--d:1.1s"><rect class="pbox" width="240" height="24" rx="12"/><text class="pt" x="120" y="16.5" text-anchor="middle">i18n 模板渲染 · zh/en</text></g></g>
  <g transform="translate(352,236)"><g class="pill cy" style="--d:1.2s"><rect class="pbox" width="240" height="24" rx="12"/><text class="pt" x="120" y="16.5" text-anchor="middle">分发器 · 重试 · 令牌桶 · 审计</text></g></g>
  <path d="M472,124 L472,132" stroke="#3fb950" stroke-width="1.2" marker-end="url(#mgrn)"/>
  <path d="M472,158 L472,166" stroke="#3fb950" stroke-width="1.2" marker-end="url(#mgrn)"/>
  <path d="M472,192 L472,200" stroke="#3fb950" stroke-width="1.2" marker-end="url(#mgrn)"/>
  <path d="M472,226 L472,234" stroke="#3fb950" stroke-width="1.2" marker-end="url(#mgrn)"/>

  <!-- sqlite + egress -->
  <g transform="translate(330,324)"><g class="chip" style="--d:1.3s"><rect class="box" width="284" height="30" rx="7"/><text class="nm" x="142" y="20" text-anchor="middle">SQLite · WAL 横切存储</text></g></g>
  <g transform="translate(330,378)"><g class="chip" style="--d:1.4s"><rect class="box" width="284" height="30" rx="7"/><text class="nm" x="142" y="20" text-anchor="middle">REST /api/v1 · SSE · /metrics · Web UI</text></g></g>

  <!-- channels -->
  <g transform="translate(686,93)"><g class="chip" style="--d:.25s"><rect class="box" width="204" height="34" rx="7"/><text class="nm" x="14" y="22.5">企微 / 钉钉 / 飞书</text></g></g>
  <g transform="translate(686,137)"><g class="chip" style="--d:.35s"><rect class="box" width="204" height="34" rx="7"/><text class="nm" x="14" y="22.5">TG / Slack / Discord</text></g></g>
  <g transform="translate(686,181)"><g class="chip" style="--d:.45s"><rect class="box" width="204" height="34" rx="7"/><text class="nm" x="14" y="22.5">SMTP 邮件</text></g></g>
  <g transform="translate(686,225)"><g class="chip" style="--d:.55s"><rect class="box" width="204" height="34" rx="7"/><text class="nm" x="14" y="22.5">Webhook · MiBeeScout</text></g></g>

  <text class="note" style="--d:2.3s" x="470" y="440" text-anchor="middle">不变量：总线满即丢最旧并计数 —— 发布者永不阻塞，接口永不因下游故障 5xx</text>

  <!-- packets -->
  <g><circle class="pkt c" r="2.5"><animateMotion begin="1.6s" dur="3s" repeatCount="indefinite"><mpath href="#pin"/></animateMotion></circle></g>
  <g><circle class="pkt" r="2.5"><animateMotion begin="2.1s" dur="2.4s" repeatCount="indefinite"><mpath href="#pstore"/></animateMotion></circle></g>
</svg>
