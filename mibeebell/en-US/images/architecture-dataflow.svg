<svg class="arch" width="940" height="300" viewBox="0 0 940 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="MiBeeBell data flow overview: ingest (7 formats) → event bus → alert pipeline (4 gates) → render → dispatcher → 17 channel plugins; mesh cluster with delivery leases cuts across pipeline and dispatcher; optional AI triage annotates the pipeline">
  <style>
    .arch{font-family:'Cascadia Code','JetBrains Mono',Consolas,Menlo,'Courier New',monospace;
      --bg:#0b0f16;--panel:#10161f;--edgest:#26313f;--fg:#e6edf3;--dim:#7d8b99;--frame:#1f2733;
      --cy:#22d3ee;--grn:#3fb950;--amb:#fbbf24;--vio:#c792ea}
    .win{fill:var(--bg);stroke:var(--frame);stroke-width:1}
    .t-title{font-size:12px;fill:var(--dim)}
    .t-badge{font-size:10.5px;fill:var(--grn);letter-spacing:.5px}
    .chip .box{fill:var(--panel);stroke:var(--edgest);stroke-width:1}
    .chip .nm{font-size:11px;fill:var(--fg)}
    .chip.side .box{stroke-dasharray:5 3;stroke:var(--vio)}
    .note{font-size:11px;fill:var(--dim)}
    .sep{stroke:var(--frame);stroke-width:1}
    .edge{fill:none;stroke:var(--cy);stroke-width:1.5;opacity:.85}
    .edge.x{stroke:var(--vio);stroke-dasharray:4 4;stroke-width:1.2;opacity:.9}
    @keyframes chipIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
    .chip{animation:chipIn .4s cubic-bezier(.2,.7,.3,1) both;animation-delay:var(--d,0s)}
    @keyframes draw{to{stroke-dashoffset:0}}
    .draw{stroke-dasharray:1;stroke-dashoffset:1;animation:draw .5s ease-out forwards;animation-delay:var(--d,0s)}
    .pkt{fill:var(--cy)}
    @media (prefers-reduced-motion:reduce){.chip,.draw{animation:none}.draw{stroke-dashoffset:0}}
  </style>
  <defs>
    <pattern id="gp" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="13" cy="13" r="1" fill="#22d3ee" opacity=".05"/>
    </pattern>
    <marker id="mcy" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 z" fill="#22d3ee"/></marker>
    <marker id="mvio" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 z" fill="#c792ea"/></marker>
    <path id="flow" d="M162,127 L322,127" fill="none"/>
  </defs>

  <rect class="win" x="1" y="1" width="938" height="298" rx="12"/>
  <rect x="1" y="34" width="938" height="264" fill="url(#gp)"/>

  <circle cx="24" cy="18" r="5" fill="#ff5f56"/><circle cx="42" cy="18" r="5" fill="#ffbd2e"/><circle cx="60" cy="18" r="5" fill="#27c93f"/>
  <text class="t-title" x="470" y="22" text-anchor="middle">bee@bell:~/dataflow — zsh</text>
  <rect x="806" y="9" width="116" height="18" rx="9" fill="#0f1e14" stroke="#238636" stroke-width="1"/>
  <text class="t-badge" x="864" y="21.5" text-anchor="middle">● DATA FLOW</text>
  <line class="sep" x1="1" y1="34" x2="939" y2="34"/>

  <!-- main flow: 6 nodes, single row -->
  <path class="edge draw" style="--d:1.0s" pathLength="1" d="M162,127 L184,127" marker-end="url(#mcy)"/>
  <path class="edge draw" style="--d:1.1s" pathLength="1" d="M300,127 L322,127" marker-end="url(#mcy)"/>
  <path class="edge draw" style="--d:1.2s" pathLength="1" d="M438,127 L460,127" marker-end="url(#mcy)"/>
  <path class="edge draw" style="--d:1.3s" pathLength="1" d="M576,127 L598,127" marker-end="url(#mcy)"/>
  <path class="edge draw" style="--d:1.4s" pathLength="1" d="M714,127 L736,127" marker-end="url(#mcy)"/>

  <g transform="translate(50,110)"><g class="chip" style="--d:.2s"><rect class="box" width="112" height="34" rx="7"/><text class="nm" x="10" y="21.5">ingest·7</text></g></g>
  <g transform="translate(188,110)"><g class="chip" style="--d:.3s"><rect class="box" width="112" height="34" rx="7"/><text class="nm" x="10" y="21.5">event bus</text></g></g>
  <g transform="translate(326,110)"><g class="chip" style="--d:.4s"><rect class="box" width="112" height="34" rx="7"/><text class="nm" x="10" y="14">pipeline</text><text class="nm" x="10" y="28" font-size="9.5" fill="#7d8b99">4 gates</text></g></g>
  <g transform="translate(464,110)"><g class="chip" style="--d:.5s"><rect class="box" width="112" height="34" rx="7"/><text class="nm" x="10" y="21.5">i18n render</text></g></g>
  <g transform="translate(602,110)"><g class="chip" style="--d:.6s"><rect class="box" width="112" height="34" rx="7"/><text class="nm" x="10" y="21.5">dispatcher</text></g></g>
  <g transform="translate(740,110)"><g class="chip" style="--d:.7s"><rect class="box" width="118" height="34" rx="7"/><text class="nm" x="10" y="14">channels</text><text class="nm" x="10" y="28" font-size="9.5" fill="#7d8b99">17 types</text></g></g>

  <!-- mesh: cross-cutting, feeds pipeline + dispatcher -->
  <g transform="translate(420,205)"><g class="chip side" style="--d:.9s"><rect class="box" width="200" height="34" rx="7"/><text class="nm" x="12" y="21.5">mesh cluster · delivery lease</text></g></g>
  <path class="edge x draw" style="--d:1.6s" pathLength="1" d="M470,203 C 430,185 405,168 390,148" marker-end="url(#mvio)"/>
  <path class="edge x draw" style="--d:1.7s" pathLength="1" d="M570,203 C 600,185 620,165 636,148" marker-end="url(#mvio)"/>

  <!-- AI: optional, annotates pipeline -->
  <g transform="translate(80,205)"><g class="chip side" style="--d:1.0s"><rect class="box" width="180" height="34" rx="7"/><text class="nm" x="12" y="21.5">AI triage (optional)</text></g></g>
  <path class="edge x draw" style="--d:1.8s" pathLength="1" d="M262,214 C 310,200 330,165 344,148" marker-end="url(#mvio)"/>

  <text class="note" style="--d:2.0s" x="470" y="278" text-anchor="middle">dashed = optional / cross-cutting · mesh: any node dies, notifications continue · AI: downgrades only</text>

  <g><circle class="pkt" r="2.5"><animateMotion begin="1.9s" dur="2.8s" repeatCount="indefinite"><mpath href="#flow"/></animateMotion></circle></g>
</svg>
